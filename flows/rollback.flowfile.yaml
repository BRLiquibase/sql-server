# Rollback flow
#
# Toggle (true/false), set as a GitHub Actions input:
#   RUN_SNAPSHOT   - capture a snapshot of the target before rolling back
#
# Required:
#   DEPLOYMENT_ID  - the deployment ID to roll back (find it with `liquibase history`)
#
# Connection values come from environment variables (GitHub Actions secrets):
#   LB_URL, LB_USER, LB_PASSWORD

globalVariables:
  RUN_SNAPSHOT:     "${RUN_SNAPSHOT:-true}"
  DEPLOYMENT_ID:    "${DEPLOYMENT_ID:-}"
  CHANGELOG_FILE:   "${CHANGELOG_FILE:-changelog/db.changelog-main.xml}"

  LB_URL:      "${LB_URL:-}"
  LB_USER:     "${LB_USER:-}"
  LB_PASSWORD: "${LB_PASSWORD:-}"

stages:
  Default:
    actions:
      # 1) SNAPSHOT (optional) - capture state before rolling back
      - type: liquibase
        if: "RUN_SNAPSHOT == 'true'"
        command: snapshot
        cmdArgs:
          url:       "${LB_URL}"
          username:  "${LB_USER}"
          password:  "${LB_PASSWORD}"

      # 2) ROLLBACK-ONE-UPDATE (always runs) - rolls back a single deployment, forced
      - type: liquibase
        command: rollback-one-update
        cmdArgs:
          changelog-file: "${CHANGELOG_FILE}"
          url:            "${LB_URL}"
          username:       "${LB_USER}"
          password:       "${LB_PASSWORD}"
          deploymentId:   "${DEPLOYMENT_ID}"
          force:          "true"

      # 3) STATUS (always runs) - confirm result
      - type: liquibase
        command: status
        cmdArgs:
          changelog-file: "${CHANGELOG_FILE}"
          url:            "${LB_URL}"
          username:       "${LB_USER}"
          password:       "${LB_PASSWORD}"

      # 4) HISTORY (always runs) - confirm what's applied post-rollback
      - type: liquibase
        command: history
        cmdArgs:
          url:       "${LB_URL}"
          username:  "${LB_USER}"
          password:  "${LB_PASSWORD}"
