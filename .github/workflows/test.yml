name: 1 - Test
on:
  workflow_dispatch:
    inputs:
      run_snapshot:
        description: 'Take a snapshot before deploying'
        required: true
        type: boolean
        default: true
      run_policies:
        description: 'Run policy checks before deploying'
        required: true
        type: boolean
        default: true
permissions:
  contents: write
env:
  LIQUIBASE_LICENSE_KEY: ${{ secrets.LIQUIBASE_LICENSE_KEY }}
  LB_URL: ${{ secrets.LB_URL }}
  LB_USER: ${{ secrets.LB_USER }}
  LB_PASSWORD: ${{ secrets.LB_PASSWORD }}
  RUN_SNAPSHOT: ${{ inputs.run_snapshot }}
  RUN_POLICIES: ${{ inputs.run_policies }}
  RUN_ID: ${{ github.run_id }}
jobs:
  deploy:
    runs-on: [self-hosted, macOS, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: liquibase/setup-liquibase@v2
        with:
          version: '5.2.1'
          edition: 'secure'

      - name: Create output folders
        run: mkdir -p reports snapshots

      - name: Run deploy flow
        run: liquibase flow --flow-file=flows/deploy.flowfile.yaml

      - name: Move checks report into reports folder
        if: always()
        run: |
          reportFile=$(find . -maxdepth 1 -name "Checks-run-report-*.html" | head -n 1)
          if [ -n "$reportFile" ]; then
            destName="reports/checks-report-${{ github.run_id }}.html"
            mv "$reportFile" "$destName"
            echo "Moved report to $destName"
          else
            echo "No checks report found to move."
          fi

      - name: Upload reports and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-output-${{ github.run_id }}
          path: |
            reports/
            snapshots/

      - name: Commit reports and snapshots to repo
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            async function commitFile(filePath, repoPath) {
              if (!fs.existsSync(filePath)) return;
              const content = fs.readFileSync(filePath, 'utf8');
              const contentEncoded = Buffer.from(content).toString('base64');

              let sha;
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: repoPath,
                });
                sha = data.sha;
              } catch (e) {
                sha = undefined;
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: repoPath,
                message: `Deploy output for run ${{ github.run_id }}`,
                content: contentEncoded,
                sha,
              });
              console.log(`Committed ${repoPath}`);
            }

            for (const dir of ['reports', 'snapshots']) {
              if (!fs.existsSync(dir)) continue;
              const files = fs.readdirSync(dir);
              for (const file of files) {
                const filePath = path.join(dir, file);
                if (fs.statSync(filePath).isFile()) {
                  await commitFile(filePath, `${dir}/${file}`);
                }
              }
            }

      - name: Commit checks report to sql-server repo
        if: false  # temporarily disabled until CROSS_REPO_TOKEN secret is added
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CROSS_REPO_TOKEN }}
          script: |
            const fs = require('fs');
            const repoPath = `reports/checks-report-${{ github.run_id }}.html`;

            if (!fs.existsSync(repoPath)) {
              console.log("No checks report found, skipping cross-repo commit.");
              return;
            }

            const content = fs.readFileSync(repoPath, 'utf8');
            const contentEncoded = Buffer.from(content).toString('base64');

            let sha;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: 'BRLiquibase',
                repo: 'sql-server',
                path: repoPath,
              });
              sha = data.sha;
            } catch (e) {
              sha = undefined;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: 'BRLiquibase',
              repo: 'sql-server',
              path: repoPath,
              message: `Checks report for run ${{ github.run_id }}`,
              content: contentEncoded,
              sha,
            });
