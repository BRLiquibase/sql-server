name: 3 - Drift
on:
  workflow_dispatch:
    inputs:
      snapshot_file:
        description: 'Snapshot filename in snapshots/ (leave blank to use the most recent one)'
        required: false
        type: string
permissions:
  contents: write
env:
  LIQUIBASE_LICENSE_KEY: ${{ secrets.LIQUIBASE_LICENSE_KEY }}
  RUN_ID: ${{ github.run_id }}
  LB_URL: ${{ secrets.LB_URL }}
  LB_USER: ${{ secrets.LB_USER }}
  LB_PASSWORD: ${{ secrets.LB_PASSWORD }}
jobs:
  drift:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: liquibase/setup-liquibase@v2
        with:
          version: '5.2.1'
          edition: 'secure'

      - name: Create output folder
        run: New-Item -ItemType Directory -Force -Path reports

      - name: Select snapshot
        run: |
          if ("${{ inputs.snapshot_file }}" -ne "") {
            $SNAPSHOT = "snapshots/${{ inputs.snapshot_file }}"
          } else {
            $file = Get-ChildItem -Path snapshots -Filter *.json -ErrorAction SilentlyContinue |
              Sort-Object Name |
              Select-Object -Last 1
            if ($file) {
              $SNAPSHOT = "snapshots/$($file.Name)"
            } else {
              $SNAPSHOT = $null
            }
          }
          if (-not $SNAPSHOT -or -not (Test-Path $SNAPSHOT)) {
            Write-Host "No snapshot file found. Run the Deploy or Rollback workflow with a snapshot enabled first, or check the filename you passed in."
            exit 1
          }
          Write-Host "Using snapshot: $SNAPSHOT"
          echo "SNAPSHOT_FILE=$SNAPSHOT" >> $env:GITHUB_ENV

      - name: Run drift flow
        run: liquibase flow --flow-file=flows/drift.flowfile.yaml

      - name: Upload drift changelog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-output-${{ github.run_id }}
          path: reports/drift-changelog-${{ github.run_id }}.mssql.sql

      - name: Commit drift changelog to repo
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `reports/drift-changelog-${{ github.run_id }}.mssql.sql`;

            if (!fs.existsSync(path)) {
              console.log("No drift changelog found, skipping commit.");
              return;
            }

            const content = fs.readFileSync(path, 'utf8');
            const contentEncoded = Buffer.from(content).toString('base64');

            let sha;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
              });
              sha = data.sha;
            } catch (e) {
              sha = undefined;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `Drift comparison for run ${{ github.run_id }}`,
              content: contentEncoded,
              sha,
            });
