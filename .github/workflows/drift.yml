name: 3 - Drift
on:
  workflow_dispatch:
    inputs:
      snapshot_file:
        description: 'Snapshot filename in snapshots/ (leave blank to use the most recent one)'
        required: false
        type: string
permissions:
  contents: write
env:
  LIQUIBASE_LICENSE_KEY: ${{ secrets.LB_LICENSE_KEY }}
  RUN_ID: ${{ github.run_id }}
  LB_URL: ${{ secrets.LB_URL }}
  LB_USER: ${{ secrets.LB_USERNAME }}
  LB_PASSWORD: ${{ secrets.LB_PASSWORD }}
jobs:
  drift:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: liquibase/setup-liquibase@v2
        with:
          version: '5.2.1'
          edition: 'secure'

      - name: Create output folder
        run: New-Item -ItemType Directory -Force -Path reports

      - name: Select snapshot
        run: |
          if ("${{ inputs.snapshot_file }}" -ne "") {
            $SNAPSHOT = "snapshots/${{ inputs.snapshot_file }}"
          } else {
            $SNAPSHOT = Get-ChildItem -Path snapshots -Filter *.json -ErrorAction SilentlyContinue |
              Sort-Object Name |
              Select-Object -Last 1 -ExpandProperty FullName
          }

          if (-not $SNAPSHOT -or -not (Test-Path $SNAPSHOT)) {
            Write-Host "No snapshot file found. Run the Deploy or Rollback workflow with a snapshot enabled first, or check the filename you passed in."
            exit 1
          }

          Write-Host "Using snapshot: $SNAPSHOT"
          echo "SNAPSHOT_FILE=$SNAPSHOT" >> $env:GITHUB_ENV

      - name: Run drift flow
        run: liquibase flow --flow-file=flows/drift.flowfile.yaml

      - name: Upload drift changelog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-output-${{ github.run_id }}
          path: reports/drift-changelog-${{ github.run_id }}.sql

      - name: Commit drift changelog to repo
        if: always()
        run: |
          git config user.name "liquibase-bot"
          git config user.email "liquibase-bot@users.noreply.github.com"
          git add reports/
          git commit -m "Drift comparison for run ${{ github.run_id }}"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Nothing to commit"
          }
          git push
