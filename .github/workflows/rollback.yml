name: 2 - Rollback

on:
  workflow_dispatch:
    inputs:
      run_snapshot:
        description: 'Take a snapshot before rolling back'
        required: true
        type: boolean
        default: false

env:
  LIQUIBASE_LICENSE_KEY: ${{ secrets.LIQUIBASE_LICENSE_KEY }}
  LB_URL: ${{ secrets.LB_URL }}
  LB_USER: ${{ secrets.LB_USER }}
  LB_PASSWORD: ${{ secrets.LB_PASSWORD }}
  RUN_SNAPSHOT: ${{ inputs.run_snapshot }}
  LIQUIBASE_INSIGHTS_ENABLED: 'true'
  LIQUIBASE_INSIGHTS_API_URL: 'https://insights-demo.liquibase.net/api/operations/ingest'
  LIQUIBASE_INSIGHTS_AUTH_TOKEN: ${{ secrets.INSIGHTS_API_KEY }}
  LIQUIBASE_INSIGHTS_CONNECTION_IDENTIFIER: 'riley-github-actions'
  LIQUIBASE_INSIGHTS_CHANGELOG_IDENTIFIER: 'changelog-humble-numbers'

jobs:
  rollback:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: liquibase/setup-liquibase@v2
        with:
          version: '5.2.1'
          edition: 'secure'

      - name: Run rollback flow
        run: liquibase flow --flow-file=flows/rollback.flowfile.yaml