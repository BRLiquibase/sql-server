name: 2 - Rollback

on:
  workflow_dispatch:
    inputs:
      run_snapshot:
        description: 'Take a snapshot before rolling back'
        required: true
        type: boolean
        default: true

env:
  LIQUIBASE_LICENSE_KEY: ${{ secrets.LB_LICENSE_KEY }}
  LB_URL: ${{ secrets.LB_URL }}
  LB_USER: ${{ secrets.LB_USERNAME }}
  LB_PASSWORD: ${{ secrets.LB_PASSWORD }}
  RUN_SNAPSHOT: ${{ inputs.run_snapshot }}

jobs:
  rollback:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: liquibase/setup-liquibase@v2
        with:
          version: '5.2.1'
          edition: 'secure'

      - name: Run rollback flow
        run: liquibase flow --flow-file=flows/rollback.flowfile.yaml