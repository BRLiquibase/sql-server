name: 1 - Deploy

on:
  workflow_dispatch:
    inputs:
      run_snapshot:
        description: 'Take a snapshot before deploying'
        required: true
        type: boolean
        default: true
      run_policies:
        description: 'Run policy checks before deploying'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  LIQUIBASE_LICENSE_KEY: ${{ secrets.LB_LICENSE_KEY }}
  LB_URL: ${{ secrets.LB_URL }}
  LB_USER: ${{ secrets.LB_USERNAME }}
  LB_PASSWORD: ${{ secrets.LB_PASSWORD }}
  RUN_SNAPSHOT: ${{ inputs.run_snapshot }}
  RUN_POLICIES: ${{ inputs.run_policies }}
  RUN_ID: ${{ github.run_id }}

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: liquibase/setup-liquibase@v2
        with:
          version: '5.2.1'
          edition: 'secure'

      - name: Create output folders
        run: mkdir -p reports snapshots

      - name: Run deploy flow
        run: liquibase flow --flow-file=flows/deploy.flowfile.yaml

      - name: Upload reports and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-output-${{ github.run_id }}
          path: |
            reports/
            snapshots/

      - name: Commit reports and snapshots to repo
        if: always()
        run: |
          git config user.name "liquibase-bot"
          git config user.email "liquibase-bot@users.noreply.github.com"
          git add reports/ snapshots/
          git commit -m "Deploy output for run ${{ github.run_id }}" || echo "Nothing to commit"
          git push